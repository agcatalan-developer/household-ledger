# /etc/nginx/sites-available/household-ledger  (symlink into sites-enabled/)
# nginx proxies EVERYTHING to Node — the Node process already serves the built
# client from the same origin, so there is no second place to be wrong about
# caching and no CORS anywhere (deployment.md).

server {
    listen 80;
    listen [::]:80;
    server_name ledger.example.com;          # <-- your domain

    # certbot fills this in; until then it 301s to https and back.
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ledger.example.com;           # <-- your domain

    # ssl_certificate / ssl_certificate_key lines are added by `certbot --nginx`.

    # HSTS — the app sets helmet's other headers; nginx owns HSTS (Phase 13).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # No uploads exist (receipt photos are out of scope), so this can stay small.
    client_max_body_size 256k;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Without this Express thinks it is on HTTP and refuses the Secure cookie —
        # the failure looks like "login does nothing". app.set('trust proxy', 1)
        # is already set in server/src/app.ts.
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }
}
